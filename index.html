<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新标日 · 语法透视读本</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='3' fill='%23a13b2b'/%3E%3Ctext x='32' y='45' font-family='serif' font-size='42' text-anchor='middle' fill='%23faf7f1'%3E%E6%97%A5%3C/text%3E%3C/svg%3E">

  <!-- 正文字体异步加载：国内网络访问 fonts.googleapis.com 经常超时，
       阻塞式 stylesheet 会让整站白屏。失败时回落到系统明朝体。 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  </noscript>

  <link rel="stylesheet" href="css/main.css?v=20261019i">
</head>
<body class="theme-paper">

  <header class="site-header">
    <div class="header-inner">
      <div class="brand-area" role="button" tabindex="0" data-kbd-click aria-label="回到第 1 课" onclick="App.selectLesson(1)" title="回到第 1 课">
        <span class="brand-title">新标日</span>
        <span class="brand-subtitle">语法透视读本</span>
      </div>

      <div class="nav-actions">
        <div class="settings-wrap">
          <button class="editorial-toggle-btn" id="settings_btn" type="button"
                  aria-expanded="false" aria-controls="settings_panel" title="显示和朗读设置">
            <span>设置</span>
            <svg class="chev" width="10" height="10" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>

          <div class="settings-panel" id="settings_panel" hidden>
            <div class="settings-group">
              <span class="settings-label">显示</span>
              <button class="editorial-toggle-btn active" id="xray_toggle" title="快捷键 X：显示或隐藏语法拆解">
                <span>语法透视</span>
              </button>
              <button class="editorial-toggle-btn active" id="furi_toggle" title="快捷键 F：显示或隐藏汉字注音">
                <span>假名</span>
              </button>
              <button class="editorial-toggle-btn" id="romaji_toggle" title="快捷键 R：显示或隐藏罗马音">
                <span>罗马音</span>
              </button>
              <button class="editorial-toggle-btn active" id="trans_toggle" title="快捷键 T：显示或隐藏中文翻译">
                <span>中文翻译</span>
              </button>
              <button class="editorial-toggle-btn active" id="theme_toggle" title="快捷键 M：切换纸白 / 黑板">
                <span class="btn-label">纸白</span>
              </button>
            </div>
            <div class="settings-group">
              <span class="settings-label">朗读</span>
              <select class="voice-select-pill" id="voice_select" title="选择发音">
                <option value="ja-JP-NanamiNeural">七海（女声）</option>
                <option value="ja-JP-KeitaNeural">庆太（男声）</option>
              </select>
              <select class="voice-select-pill" id="speed_select" title="语速">
                <option value="0.75">0.75x 慢速</option>
                <option value="1.0" selected>1.0x 常速</option>
                <option value="1.25">1.25x 较快</option>
                <option value="1.5">1.5x 高速</option>
              </select>
              <p class="tts-status" id="tts_status" hidden></p>
            </div>
          </div>
        </div>

        <button class="lesson-selector-btn" id="open_drawer_btn" title="打开课文目录"
                aria-haspopup="dialog" aria-expanded="false" aria-controls="drawer_panel">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
          <span>目录</span>
        </button>
      </div>
    </div>
  </header>

  <main class="book-container">
    <div id="lesson_content_root">
      <div class="loading-note">正在打开课本……</div>
    </div>
  </main>

  <button class="selftest-exit" id="selftest_exit" type="button" hidden
          onclick="App.exitBasicSelfTest()">显示中文</button>

  <div class="drawer-backdrop" id="drawer_backdrop">
    <div class="drawer-panel" id="drawer_panel" role="dialog" aria-modal="true" aria-labelledby="drawer_title">
      <div class="drawer-header">
        <span class="drawer-title" id="drawer_title">新版标准日本语 · 目录</span>
        <button class="drawer-close-btn" id="close_drawer_btn" aria-label="关闭目录">&times;</button>
      </div>
      <div class="drawer-search-box">
        <input type="search" class="drawer-search-input" id="drawer_search_input"
               aria-label="搜索课文、人物或语法" placeholder="搜索课文标题、人物、语法词…" />
      </div>
      <div class="drawer-list" id="drawer_list"></div>
    </div>
  </div>

  <script src="js/romaji.js?v=20261018j"></script>
  <script src="js/tts.js?v=20261019c"></script>
  <script src="js/diagram.js?v=20261019k"></script>
  <script src="js/app.js?v=20261019h"></script>
</body>
</html>
